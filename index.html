<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الناجحات</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Arial, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f9fafb;
      color: #1f2937;
    }

    .quiz-container {
      padding: 2rem 1.5rem;
      max-width: 700px;
      margin: 0 auto;
      background: white;
      min-height: 100vh;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .quiz-title {
      font-size: 14px;
      font-weight: 500;
      color: #6b7280;
    }

    .quiz-score {
      display: flex;
      gap: 8px;
    }

    .score-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
    }

    .score-incorrect {
      background: #fee2e2;
      color: #991b1b;
    }

    .score-correct {
      background: #dcfce7;
      color: #166534;
    }

    .progress-section {
      margin-bottom: 1.5rem;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #e5e7eb;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }

    .progress-fill {
      height: 100%;
      background: #3b82f6;
      transition: width 0.3s ease;
    }

    .question-counter {
      font-size: 13px;
      color: #6b7280;
    }

    .question-section {
      margin-bottom: 2rem;
    }

    .question-text {
      font-size: 16px;
      line-height: 1.8;
      color: #1f2937;
      margin-bottom: 1.5rem;
      font-weight: 500;
      white-space: pre-line;
    }

    .hint-text {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 1rem;
      font-weight: 400;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option {
      display: flex;
      gap: 12px;
      padding: 1rem;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: white;
    }

    .option:hover:not(.disabled) {
      border-color: #d1d5db;
      background: #f9fafb;
    }

    .option.selected {
      border-color: #3b82f6;
      background: #eff6ff;
    }

    .option.correct {
      background: #f0fdf4;
      border-color: #22c55e;
    }

    .option.incorrect {
      background: #fef2f2;
      border-color: #ef4444;
    }

    .option.disabled {
      cursor: not-allowed;
    }

    .option-label {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      font-weight: 600;
      font-size: 13px;
      background: #f3f4f6;
      color: #6b7280;
    }

    .option.selected .option-label {
      background: #3b82f6;
      color: white;
    }

    .option.correct .option-label {
      background: #22c55e;
      color: white;
    }

    .option.incorrect .option-label {
      background: #ef4444;
      color: white;
    }

    .option-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .option-text {
      font-size: 15px;
      color: #1f2937;
    }

    .option.correct .option-text {
      color: #166534;
      font-weight: 500;
    }

    .option.incorrect .option-text {
      color: #7f1d1d;
    }

    .option-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      margin-top: 4px;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .correct-badge {
      background: #86efac;
      color: #166534;
    }

    .incorrect-badge {
      background: #fca5a5;
      color: #7f1d1d;
    }

    .option-explanation {
      margin-top: 6px;
      font-size: 13px;
      line-height: 1.6;
      color: #4b5563;
    }

    .option.correct .option-explanation {
      color: #166534;
    }

    .option.incorrect .option-explanation {
      color: #7f1d1d;
    }

    .answer-summary {
      margin-top: 4px;
      font-size: 13px;
      line-height: 1.6;
      color: #374151;
      background: #f3f4f6;
      padding: 10px 14px;
      border-radius: 8px;
    }

    .answer-summary strong {
      color: #1f2937;
    }

    .question-summary {
      margin-top: 10px;
      font-size: 13px;
      color: #374151;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 12px 14px;
      border-radius: 8px;
    }

    .question-summary strong {
      display: block;
      margin-bottom: 6px;
      color: #1d4ed8;
      font-size: 13px;
    }

    .question-summary-text {
      white-space: pre-line;
      line-height: 1.7;
    }

    .nav-section {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid #e5e7eb;
    }

    button {
      padding: 10px 24px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      background: #f3f4f6;
      color: #1f2937;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    button:hover:not(:disabled) {
      background: #e5e7eb;
      border-color: #9ca3af;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-next {
      background: #3b82f6;
      color: white;
      border: 1px solid #3b82f6;
    }

    .btn-next:hover:not(:disabled) {
      background: #2563eb;
      border-color: #2563eb;
    }

    .start-container {
      padding: 3rem 1.5rem;
      max-width: 700px;
      margin: 0 auto;
      background: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .start-logo {
      font-size: 22px;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 2.5rem;
    }

    .start-title {
      font-size: 19px;
      font-weight: 500;
      color: #1f2937;
      line-height: 1.8;
      margin-bottom: 2rem;
    }

    .exam-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 360px;
    }

    .exam-option {
      padding: 1rem 1.5rem;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      color: #1f2937;
      transition: all 0.2s ease;
    }

    .exam-option:hover {
      border-color: #3b82f6;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .exam-note {
      margin-top: 1.5rem;
      font-size: 13px;
      color: #9ca3af;
    }

    .results-score {
      font-size: 48px;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 0.5rem;
    }

    .results-percent {
      font-size: 16px;
      font-weight: 600;
      color: #3b82f6;
      margin-bottom: 1.5rem;
    }

    .results-detail {
      display: flex;
      gap: 12px;
      margin-bottom: 2.5rem;
    }

    .results-detail .score-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="start-container" id="startScreen">
    <div class="start-logo">الناجحات</div>
    <div class="start-title">مرحباً أيها المتسابقون، اختاروا امتحاناً واحداً:</div>
    <div class="exam-list">
      <button class="exam-option" onclick="startExam('success')">10 أسئلة للنجاح</button>
    </div>
    <div class="exam-note">سأضيف امتحانات أخرى قريباً</div>
  </div>

  <div class="quiz-container" id="quizContainer" hidden>
    <div class="quiz-header">
      <div class="quiz-title" id="quizTitle">الناجحات</div>
      <div class="quiz-score">
        <div class="score-badge score-incorrect">
          <span>✕</span>
          <span id="incorrectCount">0</span>
        </div>
        <div class="score-badge score-correct">
          <span>✓</span>
          <span id="correctCount">0</span>
        </div>
      </div>
    </div>

    <div class="progress-section">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="question-counter" id="questionCounter">1/45</div>
    </div>

    <div class="question-section">
      <div class="question-text" id="questionText"></div>
      <div class="hint-text" id="hintText">يمكن اختيار أكثر من إجابة</div>
      <div class="options" id="optionsContainer"></div>
    </div>

    <div class="nav-section">
      <button id="backBtn" onclick="previousQuestion()">رجوع</button>
      <button id="nextBtn" class="btn-next" onclick="handleNextClick()">تحقق من الإجابة</button>
    </div>
  </div>

  <div class="start-container" id="resultsScreen" hidden>
    <div class="start-logo">الناجحات</div>
    <div class="start-title">اكتمل الاختبار!</div>
    <div class="results-score" id="resultsScore">0/0</div>
    <div class="results-percent" id="resultsPercent">0%</div>
    <div class="results-detail">
      <div class="score-badge score-correct">
        <span>✓</span>
        <span id="resultsCorrect">0</span>
      </div>
      <div class="score-badge score-incorrect">
        <span>✕</span>
        <span id="resultsIncorrect">0</span>
      </div>
    </div>
    <div class="exam-list">
      <button class="exam-option" onclick="backToStart()">العودة واختيار امتحان آخر</button>
    </div>
  </div>

  <script>
    const letters = ["أ", "ب", "ج", "د", "هـ"];

    const allQuestions = [
      {
        question: `في إطار تحضير ميزانية الدولة، تقرر وزارة التنمية إجراء صفقة عمومية لبناء طريق استراتيجي. تتعلق العملية بـ:
- تحديد الاحتياجات وتقييم الموارد المالية المتاحة
- اختيار مفتش الخزينة لتقييم الموارد المالية
- تطوير الملف وتوقيع العقد
- إدارة الصفقة ورقابتها

أي من العمليات التالية تمثل مراحل حقيقية من إبرام الصفقة العمومية؟`,
        options: ["التحضير فقط", "التحضير والتطوير والتوقيع والإدارة", "التقييم والتطوير والتوقيع فقط", "الرقابة والتقييم والتوقيع والإدارة", "جميع ما سبق"],
        explanations: [
          "غير صحيح: الصفقة العمومية لا تقتصر على التحضير، بل تشمل أيضاً تطوير الملف والتوقيع والإدارة والرقابة.",
          "صحيح: هذه هي المراحل الحقيقية الأربع لإبرام الصفقة كما وردت في السيناريو: التحضير، تطوير الملف وتوقيعه، ثم إدارة الصفقة ورقابتها.",
          "غير صحيح: يُسقط مرحلة الإدارة والرقابة اللاحقة التي تُعد جزءاً أساسياً من دورة حياة الصفقة.",
          "صحيح: تُعبّر بصياغة مقاربة عن نفس المراحل الأساسية (التقييم يقابل التحضير، والرقابة جزء من الإدارة والمتابعة)، فهي تغطي المراحل الفعلية للصفقة.",
          "غير صحيح: لا يمكن قبول كل الخيارات معاً لأن بعضها (كالخيار أ) يحذف مراحل جوهرية من العملية."
        ],
        correct: [1, 3]
      },
      {
        question: `أثناء تحليل إيرادات الدولة، لاحظ مفتش خزينة أن الحقوق الجمركية المستحصلة من واردات السلع تؤثر على:
- تحديد المستحقات الجمركية
- تسجيل الخزينات الجمركية
- توفير موارد الدولة المالية
- تطبيق التشريع الجمركي

أي الخيارات التالية تعكس العلاقة الصحيحة بين الجمارك والمالية العامة والخزينة؟`,
        options: ["الجمارك توفر موارد للمالية العامة فقط", "الجمارك تحصل المستحقات وتودع في الخزينة كموارد للمالية العامة", "المالية العامة تشرف على الجمارك والخزينة", "الخزينة تسجل الحقوق الجمركية والمالية العامة توزعها", "ب و د معاً"],
        explanations: [
          "غير دقيق: الجمارك لا تكتفي بتوفير موارد فقط، بل تُحصّلها وتودعها في الخزينة ضمن دورة مالية متكاملة.",
          "صحيح: الجمارك تحصّل الحقوق الجمركية ثم تودعها في الخزينة العمومية التي تشكّل بدورها موارد للمالية العامة.",
          "غير صحيح: الإشراف ليس علاقة تراتبية بهذا الشكل المباشر بين المالية العامة والجمارك والخزينة كما وُصف؛ العلاقة الأساسية هي علاقة تحصيل وإيداع.",
          "غير دقيق كوصف منفرد، لكنه يقترب من الصورة الصحيحة عند قراءته مع الخيار ب، فالخزينة تسجل وتودع والمالية العامة تستفيد من هذه الموارد.",
          "صحيح: الجمع بين تحصيل الجمارك وإيداعها في الخزينة (ب) وتسجيل الخزينة لها كموارد تُدار ضمن المالية العامة (د) يعطي الصورة الكاملة للعلاقة."
        ],
        correct: [1, 4]
      },
      {
        question: `قررت المديرية العامة للضرائب تطبيق إجراءات تحصيل الضريبة على شركة متعددة الأنشطة. خلال المعالجة، واجهت الشركة:
- عدم تقديم التصريح الضريبي في الموعد المحدد
- نقصان وثائق إثبات الدخل بنسبة 40%
- فارق ضريبي يتجاوز 5.000.000 أوقية
- تأخير في دفع المستحقات الضريبية المتفق عليها

ما هي العقوبات المترتبة عن هذه الحالات؟`,
        options: ["غرامات التأخير 25% + عدم تقديم تصريح 10%", "معاملة كدين غير قابل للتحصيل + حجز الأموال", "غرامات التأخير 25% + عقوبات عدم التصريح + عقوبات الفارق الضريبي", "فقط تصريح إداري والإشعار بالديون", "ب و ج معاً"],
        explanations: [
          "غير كامل: يذكر غرامتين فقط ويُغفل العقوبة المرتبطة بالفارق الضريبي الكبير (أكثر من 5 ملايين أوقية) المذكور في السيناريو.",
          "غير صحيح: الدين الضريبي هنا قابل للتحصيل وليس معدوماً، والحجز إجراء تنفيذي لاحق وليس المعالجة الأولى المناسبة.",
          "صحيح: الحالة تجمع تأخيراً في الدفع، وعدم تقديم تصريح، وفارقاً ضريبياً كبيراً، لذا تُطبَّق عقوبات هذه المخالفات الثلاث مجتمعة.",
          "غير كافٍ: مجرد تصريح إداري وإشعار لا يكفيان لمعالجة مخالفات بهذا الحجم، إذ يستوجب الأمر عقوبات مالية فعلية.",
          "صحيح جزئياً بالجمع: العقوبات المالية (ج) هي الأساس، وقد تُستكمل بإجراءات تحصيل كالحجز (ب) إذا استمر عدم السداد."
        ],
        correct: [2, 4]
      },
      {
        question: `يناقش اقتصاديان من مدارس مختلفة السياسة المالية المثلى:
- الاقتصادي الأول يؤكد على دور السوق الحر وتقليل تدخل الدولة
- الاقتصادي الثاني يركز على أهمية الطلب الكلي والسياسة المالية الكينزية
- الاقتصادي الثالث يرى أن توزيع الثروة والصراع الطبقي محوري

أي الخيارات تعكس انتماءاتهم المدرسية بدقة؟`,
        options: ["الأول كلاسيكي، الثاني كينزي، الثالث ماركسي", "الأول فيزيوقراطي، الثاني نيوكلاسيكي، الثالث مؤسساتي", "الأول كلاسيكي، الثاني نقدي، الثالث ماركسي", "الأول ليبرالي حديث، الثاني كينزي، الثالث سلوكي", "الأول فقط كلاسيكي"],
        explanations: [
          "صحيح: التركيز على السوق الحر وتقليل تدخل الدولة سمة كلاسيكية، والاهتمام بالطلب الكلي والسياسة المالية التوسعية سمة كينزية، وإعطاء الأولوية للصراع الطبقي وتوزيع الثروة سمة ماركسية.",
          "غير صحيح: الفيزيوقراطية تركز على الزراعة كمصدر للثروة، والنيوكلاسيكية والمؤسساتية لا تطابقان الأوصاف الثلاثة في السيناريو.",
          "غير دقيق للاقتصادي الثاني: تركيزه على الطلب الكلي والسياسة المالية يصفه كينزياً وليس نقدياً (الذي يركز على عرض النقود).",
          "غير دقيق: لا يصف السيناريو الاقتصادي الأول بأنه ليبرالي حديث تحديداً، بل هو موقف كلاسيكي في جوهره.",
          "غير كامل: يصف اقتصادياً واحداً فقط بينما يتطلب السؤال تصنيف الثلاثة."
        ],
        correct: [0]
      },
      {
        question: `في سياق تطبيق القانون الموريتاني رقم 2026-090، يواجه مفتش الخزينة تحديات متعددة:
- الحاجة إلى الشفافية والمساواة بين المتنافسين
- ضمان استخدام المال العام بكفاءة
- التعامل مع الضغوطات السياسية والإدارية
- تطبيق آليات الرقابة المسبقة واللاحقة

أي من المبادئ التالية يعتبر أساسياً لضمان نزاهة الصفقات؟`,
        options: ["الشفافية والمساواة فقط", "الشفافية والمساواة والاقتصادية", "الاقتصادية والرقابة فقط", "الشفافية والرقابة والاقتصادية", "ب و د معاً"],
        explanations: [
          "غير كامل: يهمل مبدأ الاقتصادية (استخدام المال العام بكفاءة) المذكور صراحة في السيناريو.",
          "صحيح: الشفافية والمساواة بين المتنافسين مع الاستخدام الكفء للمال العام (الاقتصادية) تشكل ركائز أساسية لنزاهة الصفقات.",
          "غير كامل: يُسقط مبدأ الشفافية والمساواة بين المتنافسين، وهو أساس عدالة المنافسة.",
          "صحيح: يجمع بين الشفافية والرقابة (المسبقة واللاحقة) والاستخدام الكفء للمال العام، وكلها مبادئ وردت في السيناريو.",
          "صحيح: تجميع مبادئ الشفافية والاقتصادية (ب) مع الرقابة (د) يعطي تصوراً متكاملاً لضمان نزاهة الصفقات."
        ],
        correct: [1, 3]
      },
      {
        question: `عندما تزيد الحقوق الجمركية على السلع المستوردة:
- ترتفع أسعار السلع المستوردة في السوق المحلي
- تنخفض الواردات وتتحسن الموازنة التجارية

          overallSummary.className = 'question-summary';

          const label = document.createElement('strong');
          label.textContent = 'ملخص توضيحي';
          overallSummary.appendChild(label);

          const text = document.createElement('div');
          text.className = 'question-summary-text';
          text.textContent = q.summary;
          overallSummary.appendChild(text);

          container.appendChild(overallSummary);
        }
      }

      const correctCount = results.filter(r => r === true).length;
      const incorrectCount = results.filter(r => r === false).length;
      document.getElementById('correctCount').textContent = correctCount;
      document.getElementById('incorrectCount').textContent = incorrectCount;

      document.getElementById('backBtn').disabled = currentQuestion === 0;

      const nextBtn = document.getElementById('nextBtn');
      if (!isChecked) {
        nextBtn.textContent = 'تحقق من الإجابة';
        nextBtn.disabled = selectedSet.size === 0;
      } else {
        nextBtn.textContent = currentQuestion === questions.length - 1 ? 'إنهاء' : 'التالي';
        nextBtn.disabled = false;
      }
    }

    function toggleOption(idx) {
      const set = selections[currentQuestion];
      if (set.has(idx)) {
        set.delete(idx);
      } else {
        set.add(idx);
      }
      updateUI();
    }

    function checkAnswer() {
      const q = questions[currentQuestion];
      const selectedSet = selections[currentQuestion];
      const correctSet = new Set(q.correct);
      const isCorrect = selectedSet.size === correctSet.size &&
        [...selectedSet].every(idx => correctSet.has(idx));
      checked[currentQuestion] = true;
      results[currentQuestion] = isCorrect;
      updateUI();
    }

    function handleNextClick() {
      if (!checked[currentQuestion]) {
        checkAnswer();
      } else {
        nextQuestion();
      }
    }

    function previousQuestion() {
      if (currentQuestion > 0) {
        currentQuestion--;
        updateUI();
      }
    }

    function nextQuestion() {
      if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        updateUI();
      } else {
        showResults();
      }
    }

    function showResults() {
      const total = questions.length;
      const correctCount = results.filter(r => r === true).length;
      const incorrectCount = results.filter(r => r === false).length;
      const percent = total === 0 ? 0 : Math.round((correctCount / total) * 100);

      document.getElementById('resultsScore').textContent = `${correctCount}/${total}`;
      document.getElementById('resultsPercent').textContent = `${percent}%`;
      document.getElementById('resultsCorrect').textContent = correctCount;
      document.getElementById('resultsIncorrect').textContent = incorrectCount;

      document.getElementById('quizContainer').hidden = true;
      document.getElementById('resultsScreen').hidden = false;
    }

    function backToStart() {
      document.getElementById('resultsScreen').hidden = true;
      document.getElementById('startScreen').hidden = false;
    }

    function startExam(examType) {
      if (examType === 'cases') {
        questions = allQuestions.slice(15);
      } else if (examType === 'success') {
        questions = successQuestions;
      } else {
        questions = allQuestions.slice(0, 15);
      }
      currentQuestion = 0;
      selections = questions.map(() => new Set());
      checked = new Array(questions.length).fill(false);
      results = new Array(questions.length).fill(null);

      document.getElementById('startScreen').hidden = true;
      document.getElementById('resultsScreen').hidden = true;
      document.getElementById('quizContainer').hidden = false;
      updateUI();
    }
  </script>
</body>
</html>
