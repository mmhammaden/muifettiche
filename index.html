<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الناجحات</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Arial, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f9fafb;
      color: #1f2937;
    }

    .quiz-container {
      padding: 2rem 1.5rem;
      max-width: 700px;
      margin: 0 auto;
      background: white;
      min-height: 100vh;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .quiz-title {
      font-size: 14px;
      font-weight: 500;
      color: #6b7280;
    }

    .quiz-score {
      display: flex;
      gap: 8px;
    }

    .score-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
    }

    .score-incorrect {
      background: #fee2e2;
      color: #991b1b;
    }

    .score-correct {
      background: #dcfce7;
      color: #166534;
    }

    .progress-section {
      margin-bottom: 1.5rem;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #e5e7eb;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }

    .progress-fill {
      height: 100%;
      background: #3b82f6;
      transition: width 0.3s ease;
    }

    .question-counter {
      font-size: 13px;
      color: #6b7280;
    }

    .question-section {
      margin-bottom: 2rem;
    }

    .question-text {
      font-size: 16px;
      line-height: 1.6;
      color: #1f2937;
      margin-bottom: 1.5rem;
      font-weight: 500;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option {
      display: flex;
      gap: 12px;
      padding: 1rem;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: white;
    }

    .option:hover:not(.disabled) {
      border-color: #d1d5db;
      background: #f9fafb;
    }

    .option.selected {
      border-color: #d1d5db;
    }

    .option.correct {
      background: #f0fdf4;
      border-color: #22c55e;
    }

    .option.incorrect {
      background: #fef2f2;
      border-color: #ef4444;
    }

    .option.disabled {
      cursor: not-allowed;
    }

    .option-label {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      font-weight: 600;
      font-size: 14px;
      background: #f3f4f6;
      color: #6b7280;
    }

    .option.correct .option-label {
      background: #22c55e;
      color: white;
    }

    .option.incorrect .option-label {
      background: #ef4444;
      color: white;
    }

    .option-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .option-text {
      font-size: 15px;
      color: #1f2937;
    }

    .option.correct .option-text {
      color: #166534;
      font-weight: 500;
    }

    .option.incorrect .option-text {
      color: #7f1d1d;
    }

    .option-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      margin-top: 4px;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .correct-badge {
      background: #86efac;
      color: #166534;
    }

    .incorrect-badge {
      background: #fca5a5;
      color: #7f1d1d;
    }

    .explanation {
      font-size: 13px;
      line-height: 1.6;
      margin-top: 6px;
      color: #6b7280;
    }

    .option.correct .explanation {
      color: #166534;
    }

    .option.incorrect .explanation {
      color: #7f1d1d;
    }

    .nav-section {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid #e5e7eb;
    }

    button {
      padding: 10px 24px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      background: #f3f4f6;
      color: #1f2937;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    button:hover:not(:disabled) {
      background: #e5e7eb;
      border-color: #9ca3af;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-next {
      background: #3b82f6;
      color: white;
      border: 1px solid #3b82f6;
    }

    .btn-next:hover:not(:disabled) {
      background: #2563eb;
      border-color: #2563eb;
    }
  </style>
</head>
<body>
  <div class="quiz-container">
    <div class="quiz-header">
      <div class="quiz-title" id="quizTitle">الناجحات</div>
      <div class="quiz-score">
        <div class="score-badge score-incorrect">
          <span>✕</span>
          <span id="incorrectCount">0</span>
        </div>
        <div class="score-badge score-correct">
          <span>✓</span>
          <span id="correctCount">0</span>
        </div>
      </div>
    </div>

    <div class="progress-section">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="question-counter" id="questionCounter">1/7</div>
    </div>

    <div class="question-section">
      <div class="question-text" id="questionText">ما هي عاصمة فرنسا؟</div>
      <div class="options" id="optionsContainer"></div>
    </div>

    <div class="nav-section">
      <button id="backBtn" onclick="previousQuestion()">رجوع</button>
      <button id="nextBtn" class="btn-next" onclick="nextQuestion()">التالي</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        question: "ما هي عاصمة فرنسا؟",
        options: [
          { label: "أ", text: "ليون", explanation: "ليون مدينة كبيرة لكنها ليست العاصمة." },
          { label: "ب", text: "باريس", explanation: "باريس هي عاصمة فرنسا منذ القرن الثاني عشر." },
          { label: "ج", text: "مرسيليا", explanation: "مرسيليا هي ثاني أكبر مدينة في فرنسا." },
          { label: "د", text: "نيس", explanation: "تقع نيس على الريفييرا الفرنسية." }
        ],
        correctIndex: 1
      },
      {
        question: "أي كوكب يُعرف بالكوكب الأحمر؟",
        options: [
          { label: "أ", text: "الزهرة", explanation: "الزهرة يُعرف بنجمة المساء." },
          { label: "ب", text: "عطارد", explanation: "عطارد هو أقرب كوكب إلى الشمس." },
          { label: "ج", text: "المريخ", explanation: "يبدو المريخ أحمر اللون بسبب أكسيد الحديد على سطحه." },
          { label: "د", text: "المشتري", explanation: "المشتري هو أكبر كوكب في مجموعتنا الشمسية." }
        ],
        correctIndex: 2
      },
      {
        question: "ما هي أصغر دولة في العالم؟",
        options: [
          { label: "أ", text: "موناكو", explanation: "موناكو دولة مدينة صغيرة ذات سيادة على البحر المتوسط." },
          { label: "ب", text: "الفاتيكان", explanation: "الفاتيكان دولة مدينة مستقلة تحيط بها روما، وتبلغ مساحتها حوالي 0.44 كيلومتر مربع." },
          { label: "ج", text: "ليختنشتاين", explanation: "ليختنشتاين دولة ألبية صغيرة بين سويسرا والنمسا." },
          { label: "د", text: "مالطا", explanation: "مالطا دولة جزرية في البحر المتوسط." }
        ],
        correctIndex: 1
      },
      {
        question: "في أي عام غرقت سفينة تايتانيك؟",
        options: [
          { label: "أ", text: "1912", explanation: "غرقت تايتانيك في 15 أبريل 1912 بعد اصطدامها بجبل جليدي." },
          { label: "ب", text: "1905", explanation: "عام 1905 كان قبل بناء تايتانيك أصلاً." },
          { label: "ج", text: "1920", explanation: "بحلول عام 1920 كانت تايتانيك قد غرقت منذ 8 سنوات." },
          { label: "د", text: "1898", explanation: "تم إطلاق تايتانيك عام 1911، ولم تغرق عام 1898." }
        ],
        correctIndex: 0
      },
      {
        question: "أي عنصر يحمل الرمز الكيميائي 'Au'؟",
        options: [
          { label: "أ", text: "الفضة", explanation: "رمز الفضة هو 'Ag' المشتق من اسمها اللاتيني 'argentum'." },
          { label: "ب", text: "الذهب", explanation: "رمز الذهب 'Au' مشتق من اسمه اللاتيني 'aurum'." },
          { label: "ج", text: "الألمنيوم", explanation: "رمز الألمنيوم هو 'Al'." },
          { label: "د", text: "الزرنيخ", explanation: "رمز الزرنيخ هو 'As'." }
        ],
        correctIndex: 1
      },
      {
        question: "ما هو أكبر محيط على وجه الأرض؟",
        options: [
          { label: "أ", text: "المحيط الأطلسي", explanation: "المحيط الأطلسي هو ثاني أكبر محيط." },
          { label: "ب", text: "المحيط الهندي", explanation: "المحيط الهندي هو ثالث أكبر محيط." },
          { label: "ج", text: "المحيط الهادئ", explanation: "يغطي المحيط الهادئ حوالي 46% من مساحة محيطات العالم." },
          { label: "د", text: "المحيط المتجمد الشمالي", explanation: "المحيط المتجمد الشمالي هو أصغر المحيطات الرئيسية." }
        ],
        correctIndex: 2
      },
      {
        question: "من كتب مسرحية 'روميو وجولييت'؟",
        options: [
          { label: "أ", text: "جين أوستن", explanation: "كتبت جين أوستن روايات مثل 'كبرياء وتحامل'." },
          { label: "ب", text: "ويليام شكسبير", explanation: "كتب شكسبير 'روميو وجولييت' في بداية مسيرته، على الأرجح بين عامي 1594-1596." },
          { label: "ج", text: "كريستوفر مارلو", explanation: "كان مارلو معاصراً لشكسبير لكنه لم يكتب هذه المسرحية." },
          { label: "د", text: "بن جونسون", explanation: "كان بن جونسون كاتباً مسرحياً لكنه لم يكتب 'روميو وجولييت'." }
        ],
        correctIndex: 1
      }
    ];

    let currentQuestion = 0;
    let answers = new Array(questions.length).fill(null);
    let answered = new Array(questions.length).fill(false);

    function updateUI() {
      const q = questions[currentQuestion];
      document.getElementById('questionText').textContent = q.question;
      document.getElementById('questionCounter').textContent = `${currentQuestion + 1}/${questions.length}`;

      const progress = ((currentQuestion + 1) / questions.length) * 100;
      document.getElementById('progressFill').style.width = progress + '%';

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const option = document.createElement('div');
        option.className = 'option';

        const isAnswered = answered[currentQuestion];
        const selected = answers[currentQuestion];
        const isCorrect = idx === q.correctIndex;

        if (isAnswered) {
          if (idx === selected && isCorrect) {
            option.classList.add('correct');
          } else if (idx === selected && !isCorrect) {
            option.classList.add('incorrect');
          } else if (isCorrect) {
            option.classList.add('correct');
          }
          option.classList.add('disabled');
        } else {
          option.onclick = () => selectOption(idx);
        }

        const label = document.createElement('div');
        label.className = 'option-label';
        label.textContent = opt.label;

        const content = document.createElement('div');
        content.className = 'option-content';

        const text = document.createElement('div');
        text.className = 'option-text';
        text.textContent = opt.text;
        content.appendChild(text);

        if (isAnswered && (idx === selected || isCorrect)) {
          const badge = document.createElement('div');
          badge.className = 'option-badge ' + (isCorrect ? 'correct-badge' : 'incorrect-badge');
          badge.textContent = isCorrect ? '✓ الإجابة الصحيحة' : '✕ إجابة خاطئة';
          content.appendChild(badge);

          const explanation = document.createElement('div');
          explanation.className = 'explanation';
          explanation.textContent = opt.explanation;
          content.appendChild(explanation);
        }

        option.appendChild(label);
        option.appendChild(content);
        container.appendChild(option);
      });

      const correctCount = answers.filter((ans, idx) => ans !== null && ans === questions[idx].correctIndex).length;
      document.getElementById('correctCount').textContent = correctCount;
      document.getElementById('incorrectCount').textContent = answered.filter(Boolean).length - correctCount;

      document.getElementById('backBtn').disabled = currentQuestion === 0;
      document.getElementById('nextBtn').disabled = !answered[currentQuestion];
      document.getElementById('nextBtn').textContent = currentQuestion === questions.length - 1 ? 'إنهاء' : 'التالي';
    }

    function selectOption(idx) {
      answers[currentQuestion] = idx;
      answered[currentQuestion] = true;
      updateUI();
    }

    function previousQuestion() {
      if (currentQuestion > 0) {
        currentQuestion--;
        updateUI();
      }
    }

    function nextQuestion() {
      if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        updateUI();
      } else {
        const correctCount = answers.filter((ans, idx) => ans === questions[idx].correctIndex).length;
        alert(`اكتمل الاختبار! لقد حصلت على ${correctCount}/${questions.length} إجابات صحيحة.`);
      }
    }

    updateUI();
  </script>
</body>
</html>
