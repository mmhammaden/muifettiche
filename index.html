<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الناجحات</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Arial, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f9fafb;
      color: #1f2937;
    }

    .quiz-container {
      padding: 2rem 1.5rem;
      max-width: 700px;
      margin: 0 auto;
      background: white;
      min-height: 100vh;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .quiz-title {
      font-size: 14px;
      font-weight: 500;
      color: #6b7280;
    }

    .quiz-score {
      display: flex;
      gap: 8px;
    }

    .score-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
    }

    .score-incorrect {
      background: #fee2e2;
      color: #991b1b;
    }

    .score-correct {
      background: #dcfce7;
      color: #166534;
    }

    .progress-section {
      margin-bottom: 1.5rem;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #e5e7eb;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }

    .progress-fill {
      height: 100%;
      background: #3b82f6;
      transition: width 0.3s ease;
    }

    .question-counter {
      font-size: 13px;
      color: #6b7280;
    }

    .question-section {
      margin-bottom: 2rem;
    }

    .question-text {
      font-size: 16px;
      line-height: 1.8;
      color: #1f2937;
      margin-bottom: 1.5rem;
      font-weight: 500;
      white-space: pre-line;
    }

    .hint-text {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 1rem;
      font-weight: 400;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option {
      display: flex;
      gap: 12px;
      padding: 1rem;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: white;
    }

    .option:hover:not(.disabled) {
      border-color: #d1d5db;
      background: #f9fafb;
    }

    .option.selected {
      border-color: #3b82f6;
      background: #eff6ff;
    }

    .option.correct {
      background: #f0fdf4;
      border-color: #22c55e;
    }

    .option.incorrect {
      background: #fef2f2;
      border-color: #ef4444;
    }

    .option.disabled {
      cursor: not-allowed;
    }

    .option-label {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      font-weight: 600;
      font-size: 13px;
      background: #f3f4f6;
      color: #6b7280;
    }

    .option.selected .option-label {
      background: #3b82f6;
      color: white;
    }

    .option.correct .option-label {
      background: #22c55e;
      color: white;
    }

    .option.incorrect .option-label {
      background: #ef4444;
      color: white;
    }

    .option-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .option-text {
      font-size: 15px;
      color: #1f2937;
    }

    .option.correct .option-text {
      color: #166534;
      font-weight: 500;
    }

    .option.incorrect .option-text {
      color: #7f1d1d;
    }

    .option-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      margin-top: 4px;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .correct-badge {
      background: #86efac;
      color: #166534;
    }

    .incorrect-badge {
      background: #fca5a5;
      color: #7f1d1d;
    }

    .answer-summary {
      margin-top: 4px;
      font-size: 13px;
      line-height: 1.6;
      color: #374151;
      background: #f3f4f6;
      padding: 10px 14px;
      border-radius: 8px;
    }

    .answer-summary strong {
      color: #1f2937;
    }

    .nav-section {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid #e5e7eb;
    }

    button {
      padding: 10px 24px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      background: #f3f4f6;
      color: #1f2937;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    button:hover:not(:disabled) {
      background: #e5e7eb;
      border-color: #9ca3af;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-next {
      background: #3b82f6;
      color: white;
      border: 1px solid #3b82f6;
    }

    .btn-next:hover:not(:disabled) {
      background: #2563eb;
      border-color: #2563eb;
    }
  </style>
</head>
<body>
  <div class="quiz-container">
    <div class="quiz-header">
      <div class="quiz-title" id="quizTitle">الناجحات</div>
      <div class="quiz-score">
        <div class="score-badge score-incorrect">
          <span>✕</span>
          <span id="incorrectCount">0</span>
        </div>
        <div class="score-badge score-correct">
          <span>✓</span>
          <span id="correctCount">0</span>
        </div>
      </div>
    </div>

    <div class="progress-section">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="question-counter" id="questionCounter">1/45</div>
    </div>

    <div class="question-section">
      <div class="question-text" id="questionText"></div>
      <div class="hint-text" id="hintText">يمكن اختيار أكثر من إجابة</div>
      <div class="options" id="optionsContainer"></div>
    </div>

    <div class="nav-section">
      <button id="backBtn" onclick="previousQuestion()">رجوع</button>
      <button id="nextBtn" class="btn-next" onclick="handleNextClick()">تحقق من الإجابة</button>
    </div>
  </div>

  <script>
    const letters = ["أ", "ب", "ج", "د", "هـ"];

    const questions = [
      {
        question: `في إطار تحضير ميزانية الدولة، تقرر وزارة التنمية إجراء صفقة عمومية لبناء طريق استراتيجي. تتعلق العملية بـ:
- تحديد الاحتياجات وتقييم الموارد المالية المتاحة
- اختيار مفتش الخزينة لتقييم الموارد المالية
- تطوير الملف وتوقيع العقد
- إدارة الصفقة ورقابتها

أي من العمليات التالية تمثل مراحل حقيقية من إبرام الصفقة العمومية؟`,
        options: ["التحضير فقط", "التحضير والتطوير والتوقيع والإدارة", "التقييم والتطوير والتوقيع فقط", "الرقابة والتقييم والتوقيع والإدارة", "جميع ما سبق"],
        correct: [1, 3]
      },
      {
        question: `أثناء تحليل إيرادات الدولة، لاحظ مفتش خزينة أن الحقوق الجمركية المستحصلة من واردات السلع تؤثر على:

أي الخيارات التالية تعكس العلاقة الصحيحة بين الجمارك والمالية العامة والخزينة؟`,

        correct: [1, 4]
      },
      {
        question: `قررت المديرية العامة للضرائب تطبيق إجراءات تحصيل الضريبة على شركة متعددة الأنشطة. خلال المعالجة، واجهت الشركة:
- عدم تقديم التصريح الضريبي في الموعد المحدد
- نقصان وثائق إثبات الدخل بنسبة 40%

ما هي العقوبات المترتبة عن هذه الحالات؟`,
        options: ["غرامات التأخير 25% + عدم تقديم تصريح 10%", "معاملة كدين غير قابل للتحصيل + حجز الأموال", "غرامات التأخير 25% + عقوبات عدم التصريح + عقوبات الفارق الضريبي", "فقط تصريح إداري والإشعار بالديون", "ب و ج معاً"],
        correct: [2, 4]
      },
      {
        question: `يناقش اقتصاديان من مدارس مختلفة السياسة المالية المثلى:
- الاقتصادي الأول يؤكد على دور السوق الحر وتقليل تدخل الدولة
- الاقتصادي الثاني يركز على أهمية الطلب الكلي والسياسة المالية الكينزية
- الاقتصادي الثالث يرى أن توزيع الثروة والصراع الطبقي محوري

أي الخيارات تعكس انتماءاتهم المدرسية بدقة؟`,
        options: ["الأول كلاسيكي، الثاني كينزي، الثالث ماركسي", "الأول فيزيوقراطي، الثاني نيوكلاسيكي، الثالث مؤسساتي", "الأول كلاسيكي، الثاني نقدي، الثالث ماركسي", "الأول ليبرالي حديث، الثاني كينزي، الثالث سلوكي", "الأول فقط كلاسيكي"],
        correct: [0]
      },
      {
        question: `في سياق تطبيق القانون الموريتاني رقم 2026-090، يواجه مفتش الخزينة تحديات متعددة:
- الحاجة إلى الشفافية والمساواة بين المتنافسين
- ضمان استخدام المال العام بكفاءة
- التعامل مع الضغوطات السياسية والإدارية
- تطبيق آليات الرقابة المسبقة واللاحقة

أي من المبادئ التالية يعتبر أساسياً لضمان نزاهة الصفقات؟`,
        options: ["الشفافية والمساواة فقط", "الشفافية والمساواة والاقتصادية", "الاقتصادية والرقابة فقط", "الشفافية والرقابة والاقتصادية", "ب و د معاً"],

        question: `عندما تزيد الحقوق الجمركية على السلع المستوردة:

- تزداد إيرادات الخزينة والمالية العامة
- قد تؤثر على الكتلة النقدية والأسعار العامة

- يمكن التفاوض المباشر في حالات استثنائية محددة بالقانون
- يجب ضمان المساواة والشفافية
- قد تكون هناك نزاهة وتحيزات إدارية

أي الممارسات التالية تتوافق مع الشرعية القانونية؟`,
        options: ["المناقصة العلنية فقط في جميع الحالات", "المناقصة العلنية + التفاوض المباشر الاستثنائي", "اختيار المقاول بناءً على معايير إدارية", "ب فقط مع ضمان الشفافية", "أ و د معاً"],

      },
      {
        question: `تمر صفقة عمومية بـ 13 مرحلة. أي من العبارات التالية صحيحة:

- المرحلة 7 هي الإسناد والمرحلة 13 هي الدفع للمتعاقد
- الرقابة تتم في المراحل اللاحقة فقط
- الشفافية واجبة في جميع المراحل

ما الصحيح من العبارات؟`,
        options: ["1 و 4", "1، 2، و 4", "فقط 1 و 2", "2 و 4 فقط", "جميع العبارات صحيحة"],
        correct: [1]
      },
      {
        question: `مكلف ضريبي قدم تصريحاً ناقصاً بنسبة 40% من الدخل، والمبلغ المتنازع عليه يساوي 10.000.000 أوقية. عند تصحيح الإدارة:

أي من الحسابات التالية صحيح؟`,
        options: ["الضريبة المستحقة 25% من 10 ملايين + غرامة التأخير 25% إضافي", "الضريبة + غرامة 25% + عقوبات عدم تقديم تصريح إضافية", "إذا لم يصرح صحيح: ضريبة + 40% من 10 ملايين غرامة", "لا توجد غرامات إذا تم الكشف والتصحيح ذاتياً", "ب و ج معاً"],
        correct: [1, 4]
      },
      {
        question: `يرغب باحث اقتصادي في دراسة تطور الفكر الاقتصادي حول دور الدولة. يجد أن:
- الكلاسيكية: اليد الخفية (عدم التدخل)
- الماركسية: الصراع الطبقي وإعادة التوزيع
- الكينزية: تدخل الدولة في تحريك الطلب الكلي

ما الترتيب الزمني الصحيح لظهور هذه المدارس؟`,

      },
      {
        question: `عند تخطيط صفقة عمومية لبناء مدرسة بتكلفة 500.000.000 أوقية:

        correct: [3]

    let currentQuestion = 0;
    let selections = questions.map(() => new Set());
    let checked = new Array(questions.length).fill(false);
    let results = new Array(questions.length).fill(null);

    function updateUI() {
      const q = questions[currentQuestion];
      document.getElementById('questionText').textContent = q.question;
      document.getElementById('questionCounter').textContent = `${currentQuestion + 1}/${questions.length}`;

      const progress = ((currentQuestion + 1) / questions.length) * 100;
      document.getElementById('progressFill').style.width = progress + '%';

      const isChecked = checked[currentQuestion];
      const selectedSet = selections[currentQuestion];
      const correctSet = new Set(q.correct);

      document.getElementById('hintText').style.display = isChecked ? 'none' : 'block';

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      q.options.forEach((text, idx) => {
        const option = document.createElement('div');
        option.className = 'option';

        const isSelected = selectedSet.has(idx);
        const isCorrectOption = correctSet.has(idx);

        if (isChecked) {
          if (isCorrectOption) {
            option.classList.add('correct');
          } else if (isSelected) {
            option.classList.add('incorrect');
          }
          option.classList.add('disabled');
        } else {
          if (isSelected) option.classList.add('selected');
          option.onclick = () => toggleOption(idx);
        }

        const label = document.createElement('div');
        label.className = 'option-label';
        label.textContent = letters[idx];

        const content = document.createElement('div');
        content.className = 'option-content';

        const optText = document.createElement('div');
        optText.className = 'option-text';
        optText.textContent = text;
        content.appendChild(optText);

        if (isChecked && (isSelected || isCorrectOption)) {
          const badge = document.createElement('div');
          badge.className = 'option-badge ' + (isCorrectOption ? 'correct-badge' : 'incorrect-badge');
          badge.textContent = isCorrectOption ? '✓ إجابة صحيحة' : '✕ إجابة خاطئة';
          content.appendChild(badge);
        }

        option.appendChild(label);
        option.appendChild(content);
        container.appendChild(option);
      });

      if (isChecked) {
        const summary = document.createElement('div');
        summary.className = 'answer-summary';
        const correctLabels = q.correct.map(idx => letters[idx]).join('، ');
        summary.innerHTML = `<strong>الإجابة الصحيحة:</strong> ${correctLabels}`;
        container.appendChild(summary);
      }

      const correctCount = results.filter(r => r === true).length;
      const incorrectCount = results.filter(r => r === false).length;
      document.getElementById('correctCount').textContent = correctCount;
      document.getElementById('incorrectCount').textContent = incorrectCount;

      document.getElementById('backBtn').disabled = currentQuestion === 0;

      const nextBtn = document.getElementById('nextBtn');
      if (!isChecked) {
        nextBtn.textContent = 'تحقق من الإجابة';
        nextBtn.disabled = selectedSet.size === 0;
      } else {
        nextBtn.textContent = currentQuestion === questions.length - 1 ? 'إنهاء' : 'التالي';
        nextBtn.disabled = false;
      }
    }

    function toggleOption(idx) {
      const set = selections[currentQuestion];
      if (set.has(idx)) {
        set.delete(idx);
      } else {
        set.add(idx);
      }
      updateUI();
    }

    function checkAnswer() {
      const q = questions[currentQuestion];
      const selectedSet = selections[currentQuestion];
      const correctSet = new Set(q.correct);
      const isCorrect = selectedSet.size === correctSet.size &&
        [...selectedSet].every(idx => correctSet.has(idx));
      checked[currentQuestion] = true;
      results[currentQuestion] = isCorrect;
      updateUI();
    }

    function handleNextClick() {
      if (!checked[currentQuestion]) {
        checkAnswer();
      } else {
        nextQuestion();
      }
    }

    function previousQuestion() {
      if (currentQuestion > 0) {
        currentQuestion--;
        updateUI();
      }
    }

    function nextQuestion() {
      if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        updateUI();
      } else {
        const correctCount = results.filter(r => r === true).length;
        alert(`اكتمل الاختبار! لقد حصلت على ${correctCount}/${questions.length} إجابات صحيحة.`);
      }
    }

    updateUI();
  </script>
</body>
</html>
